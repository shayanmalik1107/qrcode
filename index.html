<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='18' height='18' x='3' y='3' rx='2'/><rect width='5' height='5' x='7' y='7'/><rect width='5' height='5' x='12' y='12'/><rect width='3' height='3' x='7' y='14'/><rect width='3' height='3' x='14' y='7'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Pulse | Dynamic & Static QR Code Generator & Redirect Management System</title>
    <meta name="description" content="Generate dynamic & static QR codes with real-time analytics, edit redirect URLs anytime without reprinting, customize designs, and track scans powered by Firebase Realtime Database." />
    
    <!-- Ultra-fast Inline Redirect Interceptor (Native Browser Loading) -->
    <script>
      (function() {
        try {
          var path = window.location.pathname;
          var hash = window.location.hash;
          var search = window.location.search;
          var id = null;

          var pathMatch = path.match(/\/r\/([a-zA-Z0-9_-]+)/);
          if (pathMatch && pathMatch[1]) {
            id = pathMatch[1];
          } else if (hash && hash.indexOf('#/r/') === 0) {
            id = hash.replace('#/r/', '').trim();
          } else if (search.indexOf('r=') !== -1) {
            var params = new URLSearchParams(search);
            id = params.get('r');
          }

          if (id) {
            // Direct REST API fetch from Firebase (completes in ~20-30ms)
            fetch('https://qrcode-d2c90-default-rtdb.firebaseio.com/qrcodes/' + id + '.json')
              .then(function(res) { return res.json(); })
              .then(function(data) {
                if (data && data.active !== false && data.destinationUrl) {
                  // Immediate native browser location replacement
                  window.location.replace(data.destinationUrl);
                }
              })
              .catch(function(e) {});
          }
        } catch(e) {}
      })();
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
